[project]
name = "kahowell-rhoai-architecture-diagrams"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.1.68",
    "gitpython>=3.1",
    "jsonschema>=4.26.0",
    "openai-codex>=0.147.0",
    "pygithub>=2.10.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
exclude = [".claude", "src/arch-analyzer/internal/*/testdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
