apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: controller
      containers:
        - name: manager
          image: example/controller:v1
          args:
            - --metrics-bind-address=:8443
            - --metrics-secure=true
          ports:
            - name: metrics
              containerPort: 8080
          envFrom:
            - secretRef:
                name: database-credentials
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
      volumes:
        - name: serving-cert
          secret:
            secretName: webhook-cert
---
apiVersion: v1
kind: Service
metadata:
  name: controller
spec:
  selector:
    app: controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.io
spec:
  group: example.io
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
    - name: v1
      served: true
      storage: true
---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: triton
spec:
  supportedModelFormats:
    - name: triton
      version: "2"
      autoSelect: true
    - name: onnx
  builtInAdapter:
    serverType: triton
  containers:
    - name: triton
      image: example/tritonserver:latest
    - name: adapter
      image: example/modelmesh-runtime-adapter:latest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager
rules:
  - apiGroups: [example.io]
    resources: [widgets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: system
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: controller
spec:
  hostnames: [controller.example.test]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: controller
          port: 8080
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: widgets
webhooks:
  - name: vwidgets.example.io
    failurePolicy: Fail
    clientConfig:
      service:
        name: controller
        path: /validate-example-io-v1-widget
        port: 9443
    rules:
      - apiGroups: [example.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [widgets]
