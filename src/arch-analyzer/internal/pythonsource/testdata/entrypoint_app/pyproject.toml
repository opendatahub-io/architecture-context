[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "cryptography>=43.0",
  "pyjwt>=2.0",
  "kubernetes>=30.0",
]

[project.scripts]
auth-serve = "auth_service.main:run"
auth-migrate = "auth_service.cli:migrate"
