---
# harness/arch-context.yaml — the architecture-context workflow as a
# fullsend harness (pi runtime, deterministic workflow-engine parent).
#
# The parent model performs zero inference: the provider registered by
# the workflow-engine plugin emits one deterministic `workflow` tool
# call built from the env below; the tool executes
# workflows/arch-context.mjs (analyzer-baseline validation → per-
# component analysis fan-out → platform synthesis) with real pi
# children spawned via the fullsend manifest recipe.
agent: agents/arch-context.md
model: workflow-engine/v1
role: archctx
slug: opendatahub-arch-context
image: localhost/fullsend-archctx:v1
policy: policies/base.yaml
plugins:
  - plugins/workflow-engine

# Runs on the RUNNER before sandbox creation: ensures the target repo
# carries the workflow's inputs (checkouts, analyzer baselines,
# components.json) — verifies pins when present, prepares when missing.
pre_script: scripts/pre-archctx.sh

env:
  sandbox:
    WORKFLOW_COMMAND: "run-arch-context"
    # Relative to the parent pi's cwd, which the runtime sets to the
    # uploaded target repo root — robust against the sandbox workspace
    # layout. Stages/concurrency/components are the CLI-parity knobs.
    WORKFLOW_INPUT: '{"platform":"breadboard","stages":["analyze","generate","collect","platform"],"concurrency":2}'
    WORKFLOW_INPUT_FILE: "architecture/breadboard/components.json"

# Children analyze real repositories; minutes each, bounded fan-out.
timeout_minutes: 60
