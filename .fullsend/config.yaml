version: "1"
# The architecture-context fork IS the fullsend dir (repo root carries
# .fullsend/). This file registers the arch-context agent so
# `fullsend run arch-context --fullsend-dir .fullsend` resolves it
# without org-config fallback.
agents:
  - source: harness/arch-context.yaml
    model: workflow-engine/v1
    runtime: pi
